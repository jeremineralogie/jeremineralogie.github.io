<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Éditeur visuel — Jeremineralogie</title>
<style>
:root{--bg:#070609;--panel:#100c13;--text:#f4f1f5;--muted:#aaa3ad;--violet:#8e5cff;--line:#2b2033}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar.bottom{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
select,button{font:inherit;font-size:.9rem;color:var(--text);background:#0e0b10;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button{cursor:pointer}
button.on,button.primary{background:var(--violet);border-color:var(--violet);color:#fff}
button:disabled{opacity:.4}
.spacer{flex:1}
.stage{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;background:#0b090e}
iframe{border:0;background:var(--bg);height:100%;width:100%;max-width:100%}
.tools{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:#0c0910;border-top:1px solid var(--line)}.tools.show{display:flex}.tools input[type=color]{width:44px;height:38px;padding:2px;background:#0e0b10;border:1px solid var(--line);border-radius:8px}.tools label{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}.danger{border-color:#7c3544;color:#ffc3cc}
.hint{font-size:.8rem;color:var(--muted);padding:0 4px;flex-basis:100%}
#css-box{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:10;padding:16px}
#css-box.show{display:flex;flex-direction:column;gap:10px}
#css-box textarea{flex:1;width:100%;background:#0e0b10;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 monospace}
</style>
</head>
<body>
<div class="bar">
  <select id="page">
    <option value="../index.html">Accueil</option>
    <option value="../boutique.html">Boutique</option>
    <option value="../articles.html">Articles</option>
    <option value="../archives.html">Archives &amp; Documentation</option>
    <option value="../collection.html">Ma collection</option>
    <option value="../identification.html">Identification</option>
    <option value="../reseaux.html">Mes réseaux</option>
    <option value="../contact.html">Contact</option>
    <option value="../legal.html">Informations légales</option>
  </select>
  <button data-w="100%" class="on">Mobile</button>
  <button data-w="820px">Tablette</button>
  <button data-w="1240px">PC</button>
  <span class="spacer"></span>
  <button id="fs" title="Plein écran">⤢ Plein écran</button>
  <button id="mode" class="primary">Mode édition</button>
  <button id="savebtn">Enregistrer</button>
  <button id="export">CSS</button>
  <div class="hint" id="hint">Touchez un élément pour le sélectionner, puis glissez-le. Poignée violette en bas à droite : redimensionner.</div>
</div>
<div class="stage"><iframe id="frame" title="Page du site"></iframe></div>
<div class="tools" id="tools">
  <select id="font"><option value="">Police…</option>
    <option value="Georgia,'Times New Roman',serif">Georgia</option>
    <option value="Inter,system-ui,-apple-system,'Segoe UI',sans-serif">Inter (défaut)</option>
    <option value="'Playfair Display',serif">Playfair Display</option>
    <option value="'Cormorant Garamond',serif">Cormorant Garamond</option>
    <option value="Lora,serif">Lora</option>
    <option value="Montserrat,sans-serif">Montserrat</option>
    <option value="Arial,Helvetica,sans-serif">Arial</option>
    <option value="'Courier New',monospace">Courier</option>
  </select>
  <label>Texte <input type="color" id="tcolor" value="#f4f1f5"></label>
  <label>Fond <input type="color" id="bcolor" value="#100c13"></label>
  <button id="rewrite">✎ Réécrire</button>
  <button id="del" class="danger">🗑 Supprimer</button>
</div>
<div class="bar bottom">
  <button id="parent" disabled>⬆ Parent</button>
  <button id="fminus" disabled>A−</button>
  <button id="fplus" disabled>A+</button>
  <button id="undo" disabled>Annuler</button>
  <button id="reset" disabled>Remettre l’élément</button>
  <button id="resetall">Tout remettre</button>
</div>
<div id="css-box">
  <textarea id="css-out" readonly></textarea>
  <div style="display:flex;gap:8px"><button class="primary" id="css-copy">Copier</button><button id="css-close">Fermer</button></div>
</div>
<script src="../assets/js/supabase-config.js"></script>
<script type="module">
import { getSupabase } from "../assets/js/supabase-client.js";
const $=id=>document.getElementById(id);
const frame=$('frame');
const origText=new WeakMap();
const FONT_LINK='https://fonts.googleapis.com/css2?family=Playfair+Display&family=Cormorant+Garamond&family=Lora&family=Montserrat&display=swap';
let doc=null,page='',sel=null,editing=true,changes={},history=[],handle=null,box=null,all={pages:{}},dirty=false,ready=false;
const sb=getSupabase();
const setDirty=v=>{dirty=v;$('savebtn').textContent=v?'Enregistrer ●':'Enregistrer';$('savebtn').classList.toggle('primary',v)};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

function save(){all.pages[page]=changes;setDirty(true)}
function load(){changes=all.pages[page]||{};all.pages[page]=changes}
async function fetchAll(){
  if(!sb){$('hint').textContent='Configuration Supabase absente.';return}
  const {data:s}=await sb.auth.getSession();
  if(!s.session){$('hint').textContent='Connectez-vous d’abord dans l’administration pour enregistrer.'}
  const {data,error}=await sb.from('site_settings').select('value').eq('key','layout_overrides').maybeSingle();
  if(error){$('hint').textContent='Lecture impossible : '+error.message;return}
  all=(data&&data.value&&data.value.pages)?data.value:{pages:{}};
}
async function saveRemote(){
  if(!sb)return;
  for(const k of Object.keys(all.pages))if(!Object.keys(all.pages[k]).length)delete all.pages[k];
  $('savebtn').disabled=true;
  const {error}=await sb.from('site_settings').upsert({key:'layout_overrides',value:all,is_public:true},{onConflict:'key'});
  $('savebtn').disabled=false;
  if(error){$('hint').textContent='Enregistrement refusé : '+error.message+' (êtes-vous connecté en administrateur ?)';return}
  setDirty(false);load();$('hint').textContent='Enregistré : les visiteurs voient maintenant ces changements.';
}

function cssPath(el){
  if(el.id&&!el.id.startsWith('ed-'))return '#'+CSS.escape(el.id);
  const parts=[];
  while(el&&el.nodeType===1&&el!==doc.body){
    const i=[...el.parentNode.children].filter(c=>!c.hasAttribute('data-ed')).indexOf(el)+1;
    parts.unshift(el.tagName.toLowerCase()+':nth-child('+i+')');
    el=el.parentNode;
  }
  return 'body > '+parts.join(' > ');
}
function setProp(el,k,v){
  if(k==='__text'){if(!origText.has(el))origText.set(el,el.textContent);el.textContent=v}
  else if(k==='display'&&v==='none')el.classList.add('ed-del');
  else el.style.setProperty(k,v);
}
function clearProp(el,k){
  if(k==='__text'){if(origText.has(el)){el.textContent=origText.get(el);origText.delete(el)}}
  else if(k==='display')el.classList.remove('ed-del');
  else el.style.removeProperty(k);
}
function applyAll(){
  if(!doc)return;
  for(const [s,c] of Object.entries(changes)){
    let el;try{el=doc.querySelector(s)}catch(e){continue}
    if(!el)continue;
    for(const [k,v] of Object.entries(c))setProp(el,k,v);
  }
  place();
}
function record(el,props){
  const s=cssPath(el);
  history.push({s,prev:JSON.parse(JSON.stringify(changes[s]||null))});
  changes[s]=Object.assign(changes[s]||{},props);
  for(const [k,v] of Object.entries(props))setProp(el,k,v);
  save();updateButtons();place();
}
function undo(){
  const h=history.pop();if(!h)return;
  const el=doc.querySelector(h.s);
  if(el){for(const k of Object.keys(changes[h.s]||{}))clearProp(el,k)}
  if(h.prev){changes[h.s]=h.prev;if(el)for(const [k,v] of Object.entries(h.prev))setProp(el,k,v)}else delete changes[h.s];
  save();updateButtons();place();
}
function updateButtons(){
  const has=!!sel;
  ['parent','fminus','fplus'].forEach(i=>$(i).disabled=!has);
  $('tools').classList.toggle('show',has);
  if(has&&doc){const cs=doc.defaultView.getComputedStyle(sel);$('tcolor').value=hex(cs.color);$('bcolor').value=hex(cs.backgroundColor)}
  $('reset').disabled=!(has&&changes[cssPath(sel)]);
  $('undo').disabled=!history.length;
}
function hex(c){const m=(c||'').match(/[\d.]+/g);if(!m||m.length<3)return '#000000';return '#'+m.slice(0,3).map(x=>Math.round(+x).toString(16).padStart(2,'0')).join('')}
function place(){
  if(!doc||!box)return;
  if(!sel||!editing||!doc.contains(sel)){box.style.display='none';handle.style.display='none';return}
  const r=sel.getBoundingClientRect(),sx=doc.defaultView.scrollX,sy=doc.defaultView.scrollY;
  Object.assign(box.style,{display:'block',left:r.left+sx+'px',top:r.top+sy+'px',width:r.width+'px',height:r.height+'px'});
  Object.assign(handle.style,{display:'block',left:r.right+sx-14+'px',top:r.bottom+sy-14+'px'});
}
function select(el){
  stopRewrite();
  if(sel)sel.classList.remove('ed-sel');
  sel=el;
  if(sel)sel.classList.add('ed-sel');
  $('hint').textContent=sel?('Sélection : <'+sel.tagName.toLowerCase()+'>'+(sel.className&&typeof sel.className==='string'?' .'+sel.className.replace(/\s*ed-sel/,'').trim().split(/\s+/).join('.'):'')+' — glissez pour déplacer, ⬆ Parent pour choisir le bloc entier.'):'Touchez un élément pour le sélectionner.';
  updateButtons();place();
}
function translateOf(el){
  const t=(el.style.translate||'').trim().split(/\s+/);
  return [parseFloat(t[0])||0,parseFloat(t[1])||0];
}

function setup(){
  doc=frame.contentDocument;
  if(!doc||!doc.body)return;
  const st=doc.createElement('style');st.setAttribute('data-ed','');
  st.textContent='.ed-sel{outline:2px dashed #8e5cff!important;outline-offset:2px;touch-action:none!important}'+
  'html,body{overscroll-behavior:none}body.ed-on *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none}body.ed-on .ed-editing{-webkit-user-select:text!important;user-select:text!important;outline:2px solid #4ade80!important;touch-action:auto!important}.ed-del{opacity:.25!important;outline:2px dashed #ff6b81!important}'+
  '#ed-handle{position:absolute;width:28px;height:28px;background:#8e5cff;border:3px solid #fff;border-radius:8px;z-index:2147483647;touch-action:none;cursor:nwse-resize}'+
  '#ed-box{position:absolute;pointer-events:none;z-index:2147483646;background:rgba(142,92,255,.12)}';
  doc.head.appendChild(st);
  box=doc.createElement('div');box.id='ed-box';box.setAttribute('data-ed','');
  handle=doc.createElement('div');handle.id='ed-handle';handle.setAttribute('data-ed','');
  doc.body.append(box,handle);
  doc.body.classList.toggle('ed-on',editing);
  page=frame.getAttribute('data-page');load();history=[];sel=null;
  applyAll();setTimeout(applyAll,1200);setTimeout(applyAll,3500);
  bind();updateButtons();
  doc.defaultView.addEventListener('scroll',place);
  doc.defaultView.addEventListener('resize',place);
}

function target(e){
  let el=e.target;
  if(!el||el.nodeType!==1)return null;
  if(el.hasAttribute('data-ed'))return null;
  if(el===doc.documentElement)el=doc.body;
  return el;
}
function bind(){
  doc.addEventListener('click',e=>{if(editing){e.preventDefault();e.stopPropagation()}},true);
  doc.addEventListener('submit',e=>{if(editing)e.preventDefault()},true);
  let drag=null,tap=null;
  doc.addEventListener('pointerdown',e=>{
    if(!editing)return;
    if(e.target===handle){
      e.preventDefault();handle.setPointerCapture(e.pointerId);
      const r=sel.getBoundingClientRect();
      drag={mode:'size',x:e.clientX,y:e.clientY,w:r.width,h:r.height,pid:e.pointerId};return;
    }
    const el=target(e);if(!el)return;
    if(sel&&sel.isContentEditable&&(el===sel||sel.contains(el)))return;
    if(sel&&(el===sel||sel.contains(el))){
      e.preventDefault();
      const [tx,ty]=translateOf(sel);
      drag={mode:'move',x:e.clientX,y:e.clientY,tx,ty,pid:e.pointerId,el:sel};
      sel.setPointerCapture&&sel.setPointerCapture(e.pointerId);
      return;
    }
    if(e.pointerType==='mouse'){e.preventDefault();select(el);
      const [tx,ty]=translateOf(sel);
      drag={mode:'move',x:e.clientX,y:e.clientY,tx,ty,pid:e.pointerId,el:sel};
      return}
    tap={x:e.clientX,y:e.clientY,el};
  },true);
  doc.addEventListener('pointermove',e=>{
    if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap=null;
    if(!drag||e.pointerId!==drag.pid)return;
    e.preventDefault();
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(drag.mode==='move'){
      sel.style.setProperty('translate',(drag.tx+dx)+'px '+(drag.ty+dy)+'px');
    }else{
      sel.style.setProperty('width',Math.max(20,drag.w+dx)+'px');
      const isImg=sel.tagName==='IMG';
      sel.style.setProperty('height',isImg?'auto':Math.max(20,drag.h+dy)+'px');
    }
    drag.moved=true;place();
  },true);
  const end=e=>{
    if(tap&&e.type==='pointerup'){select(tap.el)}
    tap=null;
    if(!drag)return;
    const d=drag;drag=null;
    if(!d.moved)return;
    const el=sel,props=d.mode==='move'
      ?{translate:el.style.getPropertyValue('translate')}
      :{width:el.style.getPropertyValue('width'),height:el.style.getPropertyValue('height')};
    // restore then record so undo has the right previous state
    const s=cssPath(el);history.push({s,prev:JSON.parse(JSON.stringify(changes[s]||null))});
    changes[s]=Object.assign(changes[s]||{},props);
    save();updateButtons();place();
  };
  doc.addEventListener('pointerup',end,true);
  doc.addEventListener('pointercancel',e=>{tap=null;end(e)},true);
}

function loadFonts(){if(doc&&!doc.getElementById('ed-fonts')){const l=doc.createElement('link');l.id='ed-fonts';l.rel='stylesheet';l.href=FONT_LINK;l.setAttribute('data-ed','');doc.head.appendChild(l)}}
function stopRewrite(){
  if(!sel||!sel.isContentEditable)return;
  sel.contentEditable='false';sel.classList.remove('ed-editing');
  const t=sel.textContent,before=sel.__before;delete sel.__before;
  $('rewrite').textContent='✎ Réécrire';
  if(before!==undefined&&t!==before){sel.textContent=before;record(sel,{__text:t})}
}
$('rewrite').addEventListener('click',()=>{
  if(!sel)return;
  if(sel.isContentEditable){stopRewrite();return}
  if(sel.children.length){$('hint').textContent='Cet élément contient d’autres éléments : touchez directement le texte à réécrire (ou ⬆ Parent pour changer).';return}
  sel.__before=sel.textContent;sel.contentEditable='true';sel.classList.add('ed-editing');sel.focus();
  $('rewrite').textContent='✔ Terminer';
});
$('font').addEventListener('change',e=>{if(sel&&e.target.value){loadFonts();record(sel,{'font-family':e.target.value})}e.target.value=''});
$('tcolor').addEventListener('change',e=>{if(sel)record(sel,{color:e.target.value})});
$('bcolor').addEventListener('change',e=>{if(sel)record(sel,{'background-color':e.target.value})});
$('del').addEventListener('click',()=>{if(sel)record(sel,{display:'none'})});
$('fs').addEventListener('click',()=>{
  if(window.parent!==window){window.parent.postMessage({ed:'fs'},location.origin);return}
  const d=document.documentElement;
  if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});
});
async function load_page(url){
  if(!ready){await fetchAll();ready=true}
  const name=url.split('/').pop();
  page=name;frame.setAttribute('data-page',name);frame.src=url+'?ed=1';sel=null;
}
frame.addEventListener('load',()=>{try{setup();if(JSON.stringify(changes).includes('font-family'))loadFonts()}catch(e){$('hint').textContent='Erreur : '+e.message}});
$('page').addEventListener('change',e=>{if(dirty&&!confirm('Modifications non enregistrées. Changer de page quand même ?')){e.target.value='../'+page;return}load_page(e.target.value)});
document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  frame.style.width=b.dataset.w;setTimeout(place,100);
}));
$('mode').addEventListener('click',()=>{
  editing=!editing;$('mode').textContent=editing?'Mode édition':'Aperçu (liens actifs)';
  $('mode').classList.toggle('primary',editing);
  if(doc)doc.body.classList.toggle('ed-on',editing);place();
});
$('parent').addEventListener('click',()=>{if(sel&&sel.parentElement&&sel.parentElement!==doc.documentElement)select(sel.parentElement)});
function fsize(f){
  if(!sel)return;
  const cur=parseFloat(doc.defaultView.getComputedStyle(sel).fontSize);
  record(sel,{'font-size':(Math.round(cur*f*10)/10)+'px'});
}
$('fplus').addEventListener('click',()=>fsize(1.1));
$('fminus').addEventListener('click',()=>fsize(1/1.1));
$('undo').addEventListener('click',undo);
$('savebtn').addEventListener('click',saveRemote);
$('reset').addEventListener('click',()=>{
  if(!sel)return;const s=cssPath(sel);
  if(changes[s]){for(const k of Object.keys(changes[s]))clearProp(sel,k);delete changes[s];save();updateButtons();place()}
});
$('resetall').addEventListener('click',()=>{
  if(!Object.keys(changes).length||!confirm('Remettre toute la page comme sur le site ?'))return;
  for(const s of Object.keys(changes)){const el=doc.querySelector(s);if(el)for(const k of Object.keys(changes[s]))clearProp(el,k)}
  for(const k of Object.keys(changes))delete changes[k];history=[];setDirty(true);updateButtons();place();
});
$('export').addEventListener('click',()=>{
  let out='/* Modifications — '+page.replace('../','')+' */\n';
  for(const [s,c] of Object.entries(changes)){
    out+=s+'{'+Object.entries(c).filter(([k])=>!k.startsWith('__')).map(([k,v])=>k+':'+v).join(';')+'}\n';
  }
  if(!Object.keys(changes).length)out+='/* aucune modification */\n';
  $('css-out').value=out;$('css-box').classList.add('show');
});
$('css-close').addEventListener('click',()=>$('css-box').classList.remove('show'));
$('css-copy').addEventListener('click',()=>{
  const t=$('css-out');t.select();
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy'));
  $('css-copy').textContent='Copié ✓';setTimeout(()=>$('css-copy').textContent='Copier',1500);
});
load_page($('page').value);
</script>
</body>
</html>
