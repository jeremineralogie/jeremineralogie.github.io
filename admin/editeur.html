<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Éditeur — Jeremineralogie</title>
<style>
:root{--bg:#070609;--panel:rgba(16,12,19,.94);--text:#f4f1f5;--muted:#aaa3ad;--violet:#8e5cff;--line:#2b2033}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.3 Inter,system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:#1a1222;border:1px solid var(--line);border-radius:10px;min-width:42px;height:42px;padding:0 10px;cursor:pointer;white-space:nowrap;flex:none}
button:active{background:var(--violet)}
button.danger{background:#7c1d2e;border-color:#ff6b81;color:#fff}
button.on,button.primary{background:var(--violet);border-color:var(--violet);color:#fff}
button:disabled{opacity:.3}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;pointer-events:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar::-webkit-scrollbar{display:none}
.bar[hidden]{display:none}
.chip{font-size:.8rem;color:#e6dcff;background:#241a33;border-radius:8px;padding:0 10px;height:42px;display:flex;align-items:center;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.sep{width:1px;height:26px;background:var(--line);flex:none}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.6rem;color:var(--muted);gap:1px;flex:none;height:42px}
input[type=color]{width:42px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent}
select{height:42px;background:#1a1222;border:1px solid var(--line);border-radius:10px;padding:0 8px;max-width:130px;flex:none}
#fab{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:21;width:48px;height:48px;border-radius:50%;background:var(--violet);border-color:var(--violet);font-size:1.3rem;display:none}
body.min #dock{display:none}body.min #fab{display:block}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet>div{background:#100c13;border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(520px,100%);max-height:80vh;overflow:auto;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:4px 4px 10px;font-weight:600}
.pg{display:flex;align-items:center;gap:8px;width:100%;height:48px;margin-bottom:6px;text-align:left}
.pg i{width:9px;height:9px;border-radius:50%;background:#ffb020;margin-left:auto;display:none}.pg.dirty i{display:block}
.pg.cur{border-color:var(--violet)}
.sheet textarea{width:100%;min-height:120px;background:#0e0b10;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:#1a1222;border:1px solid var(--violet);border-radius:10px;padding:10px 16px;z-index:60;max-width:92vw;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);text-align:center}
#toast.show{display:block}
</style>
</head>
<body>
<iframe id="frame" title="Page du site"></iframe>

<div id="dock">
  <div class="bar" id="ctx" hidden>
    <span class="chip" id="chip"></span>
    <button id="up" title="Sélectionner la zone parent">▲</button>
    <button id="down" title="Sélectionner l’élément à l’intérieur">▼</button>
    <span class="sep"></span>
    <button id="fminus">A−</button><button id="fplus">A+</button>
    <div class="col"><input type="color" id="tcolor"><span>texte</span></div>
    <div class="col"><input type="color" id="bcolor"><span>fond</span></div>
    <select id="font"><option value="">Police</option></select>
    <button id="edit" title="Réécrire le texte">✎</button>
    <button id="hide" title="Masquer / afficher">🗑</button>
    <button id="reset" title="Remettre cet élément comme avant">↺</button>
    <span class="sep"></span>
    <button id="copy">⧉ Copier la zone</button>
    <button id="copyall">⧉ Sur toutes les pages</button>
  </div>
  <div class="bar" id="main">
    <button id="pages">☰ Pages</button>
    <button id="undo" disabled>↶</button><button id="redo" disabled>↷</button>
    <button id="grid">▦ Grille</button>
    <button id="paste" disabled>⎘ Coller</button>
    <button id="reset-page" title="Revenir aux paramètres de base de cette page">↺ Reset page</button>
    <button id="mode">👁</button>
    <button id="fs">⤢</button>
    <button id="min">⌄</button>
    <button id="quit">✕</button>
    <button id="pub" class="primary">Publier</button>
  </div>
</div>
<button id="fab">⋯</button>

<div class="sheet" id="pagesheet"><div>
  <h3>Pages</h3><div id="pagelist"></div>
  <button class="pg" id="resetpage">↺ Reset cette page (revenir à la base)</button>
  <button class="pg" id="resetall">↺ Reset toutes les pages (revenir à la base)</button>
  <button class="pg" id="closepages">Fermer</button>
</div></div>
<div class="sheet" id="textsheet"><div>
  <h3>Réécrire le texte</h3><textarea id="textarea"></textarea>
  <button class="pg primary" id="textok">OK</button>
</div></div>
<div id="toast"></div>

<script src="../assets/js/supabase-config.js"></script>
<script type="module">
import { getSupabase } from "../assets/js/supabase-client.js";
const $=id=>document.getElementById(id);
const frame=$('frame');
const sb=getSupabase();
const PAGES=[['index.html','Accueil'],['boutique.html','Boutique'],['articles.html','Articles'],['archives.html','Archives & Documentation'],['collection.html','Ma collection'],['carte.html','Carte'],['apprendre.html','Apprendre'],['identification.html','Identification'],['reseaux.html','Mes réseaux'],['contact.html','Contact'],['legal.html','Informations légales']];
const FONTS=[["Georgia,'Times New Roman',serif",'Georgia'],["Inter,system-ui,-apple-system,'Segoe UI',sans-serif",'Inter'],["'Playfair Display',serif",'Playfair Display'],["'Cormorant Garamond',serif",'Cormorant'],['Lora,serif','Lora'],['Montserrat,sans-serif','Montserrat'],['Poppins,sans-serif','Poppins'],['Oswald,sans-serif','Oswald'],['Arial,Helvetica,sans-serif','Arial'],["'Courier New',monospace",'Courier']];
const FONT_LINK='https://fonts.googleapis.com/css2?family=Playfair+Display&family=Cormorant+Garamond&family=Lora&family=Montserrat&family=Poppins&family=Oswald&display=swap';
FONTS.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;$('font').append(o)});

const BPS=['base','tablet','mobile'];
const emptyAll=()=>({pages:{},tablet:{},mobile:{},global:{base:{},tablet:{},mobile:{}}});
const clone=v=>JSON.parse(JSON.stringify(v));
function normalize(v){const b=emptyAll();if(v&&typeof v==='object'){b.pages=v.pages||{};b.tablet=v.tablet||{};b.mobile=v.mobile||{};if(v.global)for(const k of BPS)b.global[k]=v.global[k]||{}}return b}
function clean(a){
  for(const k of['pages','tablet','mobile'])for(const p of Object.keys(a[k])){for(const s of Object.keys(a[k][p]))if(!Object.keys(a[k][p][s]).length)delete a[k][p][s];if(!Object.keys(a[k][p]).length)delete a[k][p]}
  for(const k of BPS)for(const s of Object.keys(a.global[k]))if(!Object.keys(a.global[k][s]).length)delete a.global[k][s];
  return a;
}
const pageSig=(a,p)=>JSON.stringify([a.pages[p]||{},a.tablet[p]||{},a.mobile[p]||{}]);

let all=emptyAll(),saved=emptyAll(),page=PAGES[0][0],sel=null,editing=true,gridSize=0;
let doc=null,eng=null,box=null,handle=null,gridEl=null,undoS=[],redoS=[],clip=null;
const origText=new Map();let textSig='';
const DRAFT='ed:v3:draft',CLIP='ed:v3:clip';
try{clip=JSON.parse(localStorage.getItem(CLIP))}catch(e){}

let tt;function toast(m,ms=2800){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms)}
const bpNow=()=>{const w=doc?doc.defaultView.innerWidth:1200;return w<=620?'mobile':w<=850?'tablet':'base'};
function layerFor(bp,p){
  if(bp==='base')return all.pages[p]||(all.pages[p]={});
  return all[bp][p]||(all[bp][p]={});
}
const layerW=()=>layerFor(bpNow(),page);
function cssPath(el){
  if(el===doc.body)return 'body';
  const parts=[];
  while(el&&el.nodeType===1&&el!==doc.body){
    const i=[...el.parentNode.children].filter(c=>!c.hasAttribute('data-ed')).indexOf(el)+1;
    parts.unshift(el.tagName.toLowerCase()+':nth-child('+i+')');
    el=el.parentNode;
  }
  return 'body > '+parts.join(' > ');
}
const hex=c=>{const m=(c||'').match(/[\d.]+/g);if(!m||m.length<3)return '#000000';return '#'+m.slice(0,3).map(x=>Math.round(+x).toString(16).padStart(2,'0')).join('')};
const cs=()=>doc.defaultView.getComputedStyle(sel);
const nx=el=>el&&el.nodeType===1&&!el.hasAttribute('data-ed')&&!['SCRIPT','STYLE','LINK','META','NOSCRIPT','TEMPLATE'].includes(el.tagName);
const pageW=()=>doc?doc.documentElement.clientWidth:0;
const cell=()=>{if(!gridSize||!doc)return 0;const W=pageW();return W/Math.max(1,Math.round(W/gridSize))};
const snapV=v=>{const c=cell();return c?Math.round(v/c)*c:Math.round(v)};

/* ---------- réglages ---------- */
function setProp(prop,val){
  if(!sel)return;
  const L=prop==='__text'?layerFor('base',page):layerW();
  const s=cssPath(sel);
  if(val===null||val===''){if(L[s]){delete L[s][prop];if(!Object.keys(L[s]).length)delete L[s]}}
  else(L[s]||(L[s]={}))[prop]=val;
}
const layerVal=prop=>{if(!sel)return;const L=prop==='__text'?layerFor('base',page):layerW();const r=L[cssPath(sel)];return r?r[prop]:undefined};
const snap=()=>JSON.stringify(all);
function endChange(before){
  if(before===undefined||before===snap())return;
  undoS.push(before);if(undoS.length>100)undoS.shift();redoS=[];
  try{localStorage.setItem(DRAFT,JSON.stringify(all))}catch(e){}
  chrome();ui();
}
function restore(str){all=normalize(JSON.parse(str));refreshCss();try{localStorage.setItem(DRAFT,JSON.stringify(all))}catch(e){}chrome();ui()}
function undo(){if(!undoS.length)return;redoS.push(snap());restore(undoS.pop())}
function redo(){if(!redoS.length)return;undoS.push(snap());restore(redoS.pop())}
const act=fn=>{if(!sel)return;const b=snap();fn();refreshCss();endChange(b)};

/* ---------- rendu ---------- */
function syncTexts(){
  const r=all.pages[page]||{},want={};
  for(const s in r)if(r[s].__text!=null)want[s]=r[s].__text;
  const sig=JSON.stringify(want);if(sig===textSig)return;textSig=sig;
  for(const [el,t] of origText)el.textContent=t;origText.clear();
  for(const s in want){let el;try{el=doc.querySelector(s)}catch(e){continue}if(el&&!el.children.length){origText.set(el,el.textContent);el.textContent=want[s]}}
}
function refreshCss(){
  if(!doc||!eng)return;
  const st=doc.getElementById('ed-live');if(st)st.textContent=eng.build(all,page,editing);
  syncTexts();place();
}
function place(){
  if(!doc||!box)return;
  if(!sel||!editing||!doc.contains(sel)){box.style.display='none';handle.style.display='none';return}
  const r=sel.getBoundingClientRect(),w=doc.defaultView;
  Object.assign(box.style,{display:'block',left:r.left+w.scrollX+'px',top:r.top+w.scrollY+'px',width:r.width+'px',height:r.height+'px'});
  Object.assign(handle.style,{display:sel===doc.body?'none':'block',left:r.right+w.scrollX-16+'px',top:r.bottom+w.scrollY-16+'px'});
}
function gridRefresh(){
  if(!doc||!gridEl)return;
  const w=doc.defaultView,g=gridSize;
  gridEl.style.display=g&&editing?'block':'none';
  if(!g)return;
  gridEl.style.height=Math.max(doc.documentElement.scrollHeight,w.innerHeight)+'px';
  const c=cell();gridEl.style.backgroundSize=c+'px '+c+'px';
}
function label(el){
  let n=el.tagName.toLowerCase();
  const c=typeof el.className==='string'&&el.className.split(/\s+/).filter(x=>x&&!x.startsWith('ed-'))[0];if(c)n+='.'+c;
  return n;
}
function ui(){
  const has=!!sel&&!!doc;
  $('ctx').hidden=!has||!editing;
  if(!has)return;
  $('chip').textContent=label(sel);
  const c=cs();
  $('tcolor').value=hex(c.color);$('bcolor').value=hex(c.backgroundColor);
  $('hide').classList.toggle('on',layerVal('display')==='none');
  $('edit').style.display=!sel.children.length&&sel!==doc.body?'':'none';
  $('copy').disabled=$('copyall').disabled=sel===doc.body;
  $('up').disabled=!sel.parentElement||sel.parentElement===doc.documentElement;
  $('down').disabled=![...sel.children].some(nx);
}
function select(el){
  if(sel)sel.classList.remove('ed-sel');
  sel=el&&el!==doc.body?el:null;
  if(sel)sel.classList.add('ed-sel');
  place();ui();
}
function chrome(){
  $('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length;
  $('paste').disabled=!clip;
  $('grid').textContent=gridSize?'▦ '+gridSize+' px':'▦ Grille';$('grid').classList.toggle('on',!!gridSize);
  $('mode').classList.toggle('on',!editing);
}

/* ---------- chargement de la page ---------- */
function setup(){
  doc=frame.contentDocument;eng=frame.contentWindow.__layoutEngine;
  if(!doc||!doc.body||!eng){toast('Page non chargée');return}
  const st=doc.createElement('style');st.setAttribute('data-ed','');
  st.textContent='html,body{overscroll-behavior:none}body{padding-bottom:150px!important}.ed-sel{outline:2px solid #8e5cff!important;outline-offset:1px}'+
   '@media(hover:hover){body.ed-on *:hover:not(.ed-sel){outline:1px dashed rgba(181,140,255,.7);outline-offset:-1px}}'+
   'body.ed-on *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none}'+
   'body.ed-on .ed-sel{touch-action:none!important}'+
   '#ed-handle{position:absolute;width:32px;height:32px;background:#8e5cff;border:3px solid #fff;border-radius:10px;z-index:2147483647;touch-action:none;cursor:nwse-resize;box-shadow:0 2px 8px rgba(0,0,0,.5)}'+
   '#ed-box{position:absolute;pointer-events:none;z-index:2147483646;background:rgba(142,92,255,.10)}'+
   '#ed-grid{position:absolute;left:0;top:0;width:100%;box-sizing:border-box;border-right:1px solid rgba(142,92,255,.28);pointer-events:none;z-index:2147483640;display:none;background-image:linear-gradient(rgba(142,92,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(142,92,255,.28) 1px,transparent 1px)}';
  doc.head.appendChild(st);
  const live=doc.createElement('style');live.id='ed-live';live.setAttribute('data-ed','');doc.head.appendChild(live);
  const l=doc.createElement('link');l.rel='stylesheet';l.href=FONT_LINK;l.setAttribute('data-ed','');doc.head.appendChild(l);
  gridEl=doc.createElement('div');gridEl.id='ed-grid';gridEl.setAttribute('data-ed','');
  box=doc.createElement('div');box.id='ed-box';box.setAttribute('data-ed','');
  handle=doc.createElement('div');handle.id='ed-handle';handle.setAttribute('data-ed','');
  doc.body.append(gridEl,box,handle);doc.body.classList.toggle('ed-on',editing);
  origText.clear();textSig='';sel=null;
  refreshCss();gridRefresh();bind();ui();
  const later=()=>{refreshCss();gridRefresh()};
  setTimeout(later,1200);setTimeout(later,3500);
  const w=doc.defaultView;w.addEventListener('scroll',place);w.addEventListener('resize',()=>{refreshCss();gridRefresh()});
  let mt;new w.MutationObserver(m=>{if(m.some(x=>[...x.addedNodes,...x.removedNodes].some(n=>n.nodeType===1&&!n.hasAttribute('data-ed')))){clearTimeout(mt);mt=setTimeout(later,250)}}).observe(doc.body,{childList:true,subtree:true});
}
function goPage(f){
  if(f===page&&doc)return;
  page=f;sel=null;doc=null;box=null;ui();chrome();frame.src='../'+f+'?ed=1';
}

/* ---------- glisser, redimensionner (avec grille) ---------- */
function target(e){let el=e.target;if(!el||el.nodeType!==1||el.hasAttribute('data-ed'))return null;if(el===doc.documentElement)el=doc.body;return nx(el)?el:null}
function tr(){const t=(cs().translate||'').trim();if(!t||t==='none')return[0,0];const p=t.split(/\s+/);return[parseFloat(p[0])||0,parseFloat(p[1])||0]}
function bind(){
  doc.addEventListener('click',e=>{if(editing){e.preventDefault();e.stopPropagation()}},true);
  doc.addEventListener('submit',e=>{if(editing)e.preventDefault()},true);
  let drag=null,tap=null;
  const rect0=()=>{const r=sel.getBoundingClientRect(),w=doc.defaultView;return{L:r.left+w.scrollX,T:r.top+w.scrollY,R:r.right+w.scrollX,B:r.bottom+w.scrollY}};
  doc.addEventListener('pointerdown',e=>{
    if(!editing)return;
    if(e.target===handle){e.preventDefault();handle.setPointerCapture(e.pointerId);drag={mode:'size',x:e.clientX,y:e.clientY,r:rect0(),pid:e.pointerId,before:snap()};return}
    const el=target(e);if(!el)return;
    const startMove=()=>{const[tx,ty]=tr();drag={mode:'move',x:e.clientX,y:e.clientY,tx,ty,r:rect0(),pid:e.pointerId,before:snap()}};
    if(sel&&(el===sel||sel.contains(el))){e.preventDefault();startMove();sel.setPointerCapture&&sel.setPointerCapture(e.pointerId);return}
    if(e.pointerType==='mouse'){e.preventDefault();select(el);if(sel)startMove();return}
    tap={x:e.clientX,y:e.clientY,el};
  },true);
  doc.addEventListener('pointermove',e=>{
    if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap=null;
    if(!drag||e.pointerId!==drag.pid)return;e.preventDefault();
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y,r=drag.r;
    if(drag.mode==='move'){
      let ddx=snapV(r.L+dx)-r.L;const ddy=snapV(r.T+dy)-r.T,W=pageW();
      if(r.L+ddx<0)ddx=-r.L;if(r.R+ddx>W)ddx=W-r.R;if(r.R-r.L>W)ddx=-r.L;
      setProp('translate',Math.round(drag.tx+ddx)+'px '+Math.round(drag.ty+ddy)+'px');
    }else{
      setProp('width',Math.max(20,Math.min(pageW(),snapV(r.R+dx))-r.L)+'px');
      setProp('height',sel.tagName==='IMG'?'auto':Math.max(20,snapV(r.B+dy)-r.T)+'px');
    }
    drag.moved=true;refreshCss();
  },true);
  const end=e=>{
    if(tap&&e.type==='pointerup'){tap.el===doc.body?select(null):select(tap.el)}
    tap=null;if(!drag)return;const d=drag;drag=null;
    if(d.moved){endChange(d.before);ui()}
  };
  doc.addEventListener('pointerup',end,true);
  doc.addEventListener('pointercancel',e=>{tap=null;end(e)},true);
  doc.addEventListener('keydown',onKey,true);
}
function onKey(e){
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(!sel||!editing)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();act(()=>setProp('display','none'));ui();return}
  const d=e.shiftKey?(cell()||10):(cell()||1),[tx,ty]=tr();let n=null;
  if(e.key==='ArrowLeft')n=[tx-d,ty];if(e.key==='ArrowRight')n=[tx+d,ty];if(e.key==='ArrowUp')n=[tx,ty-d];if(e.key==='ArrowDown')n=[tx,ty+d];
  if(n){e.preventDefault();act(()=>setProp('translate',n[0]+'px '+n[1]+'px'));ui()}
}
document.addEventListener('keydown',onKey);

/* ---------- barre contextuelle ---------- */
$('up').addEventListener('click',()=>{if(sel&&sel.parentElement&&sel.parentElement!==doc.documentElement)select(sel.parentElement)});
$('down').addEventListener('click',()=>{const k=sel&&[...sel.children].find(nx);if(k)select(k)});
const fsz=f=>act(()=>setProp('font-size',(Math.round(parseFloat(cs().fontSize)*f*10)/10)+'px'));
$('fplus').addEventListener('click',()=>{fsz(1.1);ui()});$('fminus').addEventListener('click',()=>{fsz(1/1.1);ui()});
for(const [id,prop] of [['tcolor','color'],['bcolor','background-color']]){
  let before;
  $(id).addEventListener('input',e=>{if(!sel)return;if(before===undefined)before=snap();setProp(prop,e.target.value);refreshCss()});
  $(id).addEventListener('change',()=>{endChange(before);before=undefined;ui()});
}
$('font').addEventListener('change',e=>{if(e.target.value)act(()=>setProp('font-family',e.target.value));e.target.value='';ui()});
$('hide').addEventListener('click',()=>{act(()=>setProp('display',layerVal('display')==='none'?null:'none'));ui()});
$('reset').addEventListener('click',()=>{
  if(!sel)return;const b=snap(),p=cssPath(sel);
  for(const bp of BPS){const L=layerFor(bp,page);delete L[p]}
  refreshCss();endChange(b);ui();toast('Élément remis comme avant');
});
$('edit').addEventListener('click',()=>{
  if(!sel||sel.children.length)return;
  const v=layerVal('__text');$('textarea').value=v!==undefined?v:sel.textContent;$('textsheet').classList.add('show');
  $('textarea').dataset.before=snap();$('textarea').focus();
});
$('textarea').addEventListener('input',e=>{if(sel){setProp('__text',e.target.value);refreshCss()}});
$('textok').addEventListener('click',()=>{$('textsheet').classList.remove('show');endChange($('textarea').dataset.before);ui()});

/* ---------- copier / coller une zone ---------- */
function within(k,root){return k===root||k.startsWith(root+' > ')}
function clearZone(bp,p,root){const L=layerFor(bp,p);for(const k of Object.keys(L))if(within(k,root))delete L[k]}
function writeZone(bp,p,root,src){const L=layerFor(bp,p);for(const suf of Object.keys(src))L[root+suf]=clone(src[suf])}
$('copy').addEventListener('click',()=>{
  if(!sel)return;
  const root=cssPath(sel),entries={};let n=0;
  for(const bp of BPS){entries[bp]={};const L=layerFor(bp,page);for(const k of Object.keys(L))if(within(k,root)){entries[bp][k.slice(root.length)]=clone(L[k]);n++}}
  clip={root,entries,from:page};try{localStorage.setItem(CLIP,JSON.stringify(clip))}catch(e){}
  chrome();toast(n?'Zone copiée ('+n+' réglages). Ouvrez une autre page puis touchez « Coller ».':'Cette zone n’a encore aucun réglage à copier.');
});
$('paste').addEventListener('click',()=>{
  if(!clip)return;
  const dst=sel?cssPath(sel):clip.root;
  let ok=false;try{ok=!!doc.querySelector(dst)}catch(e){}
  if(!ok){toast('Cet emplacement n’existe pas sur cette page.');return}
  const b=snap();
  for(const bp of BPS){clearZone(bp,page,dst);writeZone(bp,page,dst,clip.entries[bp])}
  refreshCss();endChange(b);ui();toast(sel?'Zone collée sur l’élément sélectionné.':'Zone collée au même emplacement.');
});
$('copyall').addEventListener('click',()=>{
  if(!sel)return;
  const root=cssPath(sel),b=snap();let n=0;
  const src={};for(const bp of BPS){src[bp]={};const L=layerFor(bp,page);for(const k of Object.keys(L))if(within(k,root))src[bp][k.slice(root.length)]=clone(L[k])}
  for(const [p] of PAGES){if(p===page)continue;for(const bp of BPS){clearZone(bp,p,root);writeZone(bp,p,root,src[bp])}n++}
  endChange(b);chrome();toast('Zone appliquée sur les '+n+' autres pages. Pensez à publier.');
});

/* ---------- pages, grille, aperçu, publication ---------- */
function pagesRender(){
  const l=$('pagelist');l.innerHTML='';
  for(const [f,n] of PAGES){
    const b=document.createElement('button');b.className='pg'+(f===page?' cur':'')+(pageSig(all,f)!==pageSig(saved,f)?' dirty':'');
    b.innerHTML='<span></span><i></i>';b.firstChild.textContent=n;
    b.addEventListener('click',()=>{$('pagesheet').classList.remove('show');goPage(f)});l.append(b);
  }
}
$('pages').addEventListener('click',()=>{pagesRender();$('pagesheet').classList.add('show')});
$('closepages').addEventListener('click',()=>$('pagesheet').classList.remove('show'));
function armed(btn,label,run){
  if(btn.dataset.armed){clearTimeout(+btn.dataset.armed);delete btn.dataset.armed;btn.textContent=btn.dataset.label;btn.classList.remove('danger');run();return}
  btn.dataset.label=btn.textContent;btn.textContent=label;btn.classList.add('danger');
  btn.dataset.armed=setTimeout(()=>{delete btn.dataset.armed;btn.textContent=btn.dataset.label;btn.classList.remove('danger')},4000);
}
function resetPages(list,withGlobal){
  const b=snap();
  for(const p of list)for(const bp of BPS){if(bp==='base')delete all.pages[p];else delete all[bp][p]}
  if(withGlobal)all.global={base:{},tablet:{},mobile:{}};
  sel=null;if(doc){const c=doc.querySelector('.ed-sel');if(c)c.classList.remove('ed-sel')}
  refreshCss();endChange(b);ui();chrome();
}
$('reset-page').addEventListener('click',e=>armed(e.currentTarget,'Confirmer ?',()=>{resetPages([page]);toast('Page remise aux paramètres de base. Touchez « Publier » pour l’appliquer au site.',4500)}));
$('resetpage').addEventListener('click',e=>armed(e.currentTarget,'Confirmer le reset de cette page ?',()=>{$('pagesheet').classList.remove('show');resetPages([page]);toast('Page remise aux paramètres de base. Pensez à publier.',4500)}));
$('resetall').addEventListener('click',e=>armed(e.currentTarget,'Confirmer : tout remettre à la base ?',()=>{$('pagesheet').classList.remove('show');resetPages(PAGES.map(p=>p[0]),true);toast('Tout le site est remis aux paramètres de base. Pensez à publier.',4500)}));
$('grid').addEventListener('click',()=>{gridSize=gridSize===0?20:gridSize===20?40:gridSize===40?10:0;chrome();gridRefresh()});
$('mode').addEventListener('click',()=>{editing=!editing;if(doc)doc.body.classList.toggle('ed-on',editing);refreshCss();gridRefresh();ui();chrome()});
$('undo').addEventListener('click',undo);$('redo').addEventListener('click',redo);
$('min').addEventListener('click',()=>document.body.classList.add('min'));
$('fab').addEventListener('click',()=>document.body.classList.remove('min'));
$('fs').addEventListener('click',()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>toast('Plein écran non disponible ici : la page occupe déjà tout l’écran.'));else toast('La page occupe déjà tout l’écran.')});
$('quit').addEventListener('click',()=>{location.href='./'});

async function fetchRemote(){
  if(!sb){toast('Configuration Supabase absente.');return}
  const {data:s}=await sb.auth.getSession();
  if(!s.session)toast('Connectez-vous d’abord dans l’administration pour pouvoir publier.',5000);
  const {data,error}=await sb.from('site_settings').select('value').eq('key','layout_overrides').maybeSingle();
  if(error){toast('Lecture impossible : '+error.message,5000);return}
  saved=normalize(data&&data.value);
}
$('pub').addEventListener('click',async()=>{
  if(!sb)return;const v=clean(clone(all));
  $('pub').disabled=true;
  const {error}=await sb.from('site_settings').upsert({key:'layout_overrides',value:v,is_public:true},{onConflict:'key'});
  $('pub').disabled=false;
  if(error){toast('Publication refusée : '+error.message+' (connecté en administrateur ?)',6000);return}
  saved=normalize(clone(v));chrome();toast('Publié : les visiteurs voient vos changements.');
});
frame.addEventListener('load',()=>{if(!frame.getAttribute('src'))return;try{setup()}catch(e){toast('Erreur : '+e.message,6000)}});
window.addEventListener('beforeunload',e=>{if(PAGES.some(p=>pageSig(all,p[0])!==pageSig(saved,p[0]))){e.preventDefault();e.returnValue=''}});

(async()=>{
  await fetchRemote();
  all=clone(saved);
  try{const d=localStorage.getItem(DRAFT);if(d){const dr=normalize(JSON.parse(d));if(JSON.stringify(dr)!==JSON.stringify(saved)){all=dr;toast('Brouillon non publié restauré.',4000)}}}catch(e){}
  chrome();frame.src='../'+page+'?ed=1';
})();
</script>
</body>
</html>
